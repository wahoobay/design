name: release
on:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check
      - name: dist is up to date
        # porcelain status catches untracked files too, which git diff does not
        run: test -z "$(git status --porcelain -- dist)"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -r "../wahoobay-design-$GITHUB_REF_NAME.zip" .)
          gh release create "$GITHUB_REF_NAME" \
            dist/tokens.css dist/components.css dist/fonts.css \
            "wahoobay-design-$GITHUB_REF_NAME.zip" \
            --generate-notes
